{{template "head" .}}
<div class="dash">
<nav class="tabs"><a href="/dash">Home</a><a href="/dash/shop">Products</a><a href="/dash/dept">Departments</a></nav>
<h1>Departments</h1>
<p class="hint">A department is a product series. Public: <code>/shop/d/{slug}</code>.</p>
<form method="post">
<p><label>Name <input name="name" required></label> <label>Min tier <input name="min_tier" value="0" size="3"></label></p>
<p><textarea name="descr" placeholder="Description"></textarea></p>
<p><button class="btn">Save department</button></p>
</form>
<ul class="plain">{{range .Data}}<li>{{.Name}} · /shop/d/{{.Slug}}</li>{{end}}</ul>
</div>
{{template "foot" .}}
