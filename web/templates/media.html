{{template "head" .}}
<div class="dash">
<nav class="tabs"><a href="/dash">Home</a><a href="/dash/media">Media</a></nav>
<h1>Media</h1>
<form method="post" enctype="multipart/form-data">
<p><input type="file" name="file" required> <button class="btn">Upload</button></p>
</form>
<ul class="plain">{{range .Data}}<li>{{.Kind}} · <a href="{{.Path}}">{{.Title}}</a> <code>{{.Path}}</code></li>{{end}}</ul>
</div>
{{template "foot" .}}
