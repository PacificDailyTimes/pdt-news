{{template "head" .}}
<div class="dash">
<nav class="tabs"><a href="/dash">Home</a><a href="/dash/edit">Compose</a></nav>
<h1>Compose</h1>
<form method="post" id="editform">
{{if .Data.ManySites}}
<p><label>Site <select name="site_id">{{range .Data.Sites}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label></p>
{{else}}
{{range .Data.Sites}}<input type="hidden" name="site_id" value="{{.ID}}">{{end}}
{{end}}
<p><label>Type <select name="type"><option value="post" {{if eq .Data.Piece.Type "post"}}selected{{end}}>piece</option><option value="page" {{if eq .Data.Piece.Type "page"}}selected{{end}}>page</option></select></label>
<label>Status <select name="status"><option value="draft">draft</option><option value="live" {{if eq .Data.Piece.Status "live"}}selected{{end}}>live</option></select></label>
<label>Series <select name="series_id"><option value="0">—</option>{{range .Data.Series}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label></p>
<p><label>Title <input name="title" required value="{{.Data.Piece.Title}}"></label></p>
<p><label>Slug <input name="slug" value="{{.Data.Piece.Slug}}"></label></p>
<p><label>Excerpt<br><textarea name="excerpt" rows="2">{{.Data.Piece.Excerpt}}</textarea></label></p>
<div class="edbar" id="edbar">
  <button type="button" data-cmd="bold"><b>B</b></button>
  <button type="button" data-cmd="italic"><i>I</i></button>
  <button type="button" data-cmd="color">Color</button>
  <input type="color" id="ink" value="#c0392b" title="Ink">
  {{range .Data.Classes}}<button type="button" data-class="{{.Name}}">.{{.Name}}</button>{{end}}
  <button type="button" data-align="left">img left</button>
  <button type="button" data-align="right">img right</button>
  <button type="button" data-align="center">img center</button>
</div>
<div class="wys" id="wys" contenteditable="true">{{.Data.Piece.Content}}</div>
<textarea name="content" id="contentField" hidden>{{.Data.Piece.Content}}</textarea>
<p><label>Featured image URL <input name="feat_img" value="{{.Data.Piece.FeatImg}}"></label></p>
<p><label>Featured audio URL <input name="feat_aud" value="{{.Data.Piece.FeatAud}}"></label></p>
<p><label>Featured video URL <input name="feat_vid" value="{{.Data.Piece.FeatVid}}"></label></p>
<p><label>Featured placement <select name="feat_place">
<option value="top">top (RSS/podcast)</option>
<option value="bottom">bottom</option>
<option value="inline">inline only</option>
</select></label></p>
<p><button class="btn">Save</button></p>
</form>
</div>
<script src="/static/js/editor.js"></script>
{{template "foot" .}}
