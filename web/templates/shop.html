{{template "head" .}}
<h1>Shop</h1>
<div class="deck">
{{range .Data}}
<article class="card">
  <p class="kicker">{{.Kind}}</p>
  <h2>{{.Title}}</h2>
  <p>{{.Body}}</p>
  <p class="price">${{.Price}}</p>
  <form method="post" action="/checkout">
    <input type="hidden" name="product_id" value="{{.ID}}">
    <p><label>Email <input type="email" name="email" required></label></p>
    <p><label>State <input name="state" size="2" placeholder="MI"></label>
       <label>ZIP <input name="zip" size="10"></label></p>
    {{if eq .Kind "subscription"}}
    <p><label>Start <input type="date" name="start_on"></label>
       <label>Skip until <input type="date" name="skip_until"></label></p>
    {{end}}
    <p><label>Pay
      <select name="pay_via">
        <option value="invoice">invoice (email + PDF)</option>
        <option value="stripe">Stripe</option>
        <option value="paypal">PayPal</option>
        <option value="crypto">crypto</option>
      </select>
    </label></p>
    <p><button class="btn">Buy</button></p>
  </form>
</article>
{{else}}<p>No products yet.</p>{{end}}
</div>
{{template "foot" .}}
