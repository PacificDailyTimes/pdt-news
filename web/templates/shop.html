{{template "head" .}}
<h1>Shop</h1>
{{if index .Data "Depts"}}<nav class="band">{{range index .Data "Depts"}}<a href="/shop/d/{{.Slug}}">{{.Name}}</a>{{end}}</nav>{{end}}
<div class="deck">
{{range index .Data "Products"}}
<article class="card">
  <p class="kicker">{{.Kind}}</p>
  <h2><a href="/shop/{{.Slug}}">{{.Title}}</a></h2>
  <p>{{.Body}}</p>
  <p class="price">${{.Price}}</p>
  <p><a class="btn" href="/shop/{{.Slug}}">View</a></p>
</article>
{{else}}<p>No products yet.</p>{{end}}
</div>
{{template "foot" .}}
