# pdt-news reverse proxy. Package installer can drop this into
# /etc/nginx/sites-available/pdt or /etc/nginx/http.d/pdt.conf
# Flags: --nginx-server-name example.tld --nginx-listen 80

upstream pdt_app {
    server 127.0.0.1:9001;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.tld;

    # After inkcert: listen 443 ssl http2; ssl_certificate ...;

    client_max_body_size 64m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://pdt_app;
    }
}
